name: Release Obsidian plugin

# Tag the repo with the manifest version (e.g. `0.2.0`, no `v` prefix — BRAT
# and the Obsidian sample-plugin convention both expect tag == manifest version)
# and this workflow builds main.js and attaches the three files an end user
# (or BRAT) installs: main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build plugin bundle
        run: bun run build

      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes
